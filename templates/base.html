<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StudyBuddy{% endblock %} | StudyBuddy</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="{{ url_for('index') }}"><span class="brand-mark" aria-hidden="true">SB</span> StudyBuddy</a>
      <nav aria-label="Main navigation">
        <a href="{{ url_for('index') }}" {% if request.endpoint == 'index' %}aria-current="page"{% endif %}>Chat</a>
        <a href="{{ url_for('quiz') }}" {% if request.endpoint == 'quiz' %}aria-current="page"{% endif %}>Quiz</a>
        <a href="{{ url_for('topics') }}" {% if request.endpoint == 'topics' %}aria-current="page"{% endif %}>Topics</a>
        <a href="{{ url_for('about') }}" {% if request.endpoint == 'about' %}aria-current="page"{% endif %}>About</a>
      </nav>
    </div>
  </header>
  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container">StudyBuddy runs locally on your computer. No external AI API is used and your questions are not sent anywhere.</div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
